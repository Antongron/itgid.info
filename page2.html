<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С праздником весны!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sofia&display=swap" rel="stylesheet">
    <style>
        .container {
            text-align: center;
            font-family: 'Sofia', cursive;
            background-image: url(./images/cat.jpg);
            background-size: contain; /* Изменено с cover на contain */
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Наклонный текст */
        .container h1 {
            transform: rotate(-10deg); /* Наклон текста на -10 градусов */
            display: inline-block; /* Чтобы трансформация применялась корректно */
            margin-top: 50px; /* Отступ сверху */
            font-size: 3rem; /* Размер текста */
            color: #ff1493; /* Цвет текста */
        }

        /* Анимация салюта */
        .firework {
            position: relative;
            width: 10px;
            height: 10px;
            background: #ff0;
            border-radius: 50%;
            animation: explode 1.5s infinite ease-out;
        }

        .firework::before,
        .firework::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f00;
            border-radius: 50%;
            animation: explode 1.5s infinite ease-out;
        }

        .firework::before {
            transform: translate(-20px, -20px);
            background: #00f;
        }

        .firework::after {
            transform: translate(20px, -20px);
            background: #0f0;
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        /* Контейнер для салюта */
        .fireworkContainer {
            display: flex;
            justify-content: center;
            margin-top: 150px;
        }

        /* Дополнительные стили для сердечек */
        .heart {
            width: 20px;
            height: 20px;
            background: red;
            position: absolute;
            transform: rotate(45deg);
            animation: float 5s infinite ease-in-out;
        }

        .heart::before,
        .heart::after {
            content: '';
            width: 20px;
            height: 20px;
            background: red;
            border-radius: 50%;
            position: absolute;
        }

        .heart::before {
            top: -10px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: -10px;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(45deg);
            }
            50% {
                transform: translateY(-20px) rotate(45deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>С праздником весны!</h1>
        <div class="fireworkContainer">
            <div class="firework"></div>
        </div>
        <!-- Сердечки -->
        <div class="heart" style="top: 10%; left: 20%;"></div>
        <div class="heart" style="top: 15%; left: 50%;"></div>
        <div class="heart" style="top: 5%; left: 70%;"></div>
        <div class="heart" style="top: 20%; left: 40%;"></div>
        <div class="heart" style="top: 25%; left: 80%;"></div>
        <div class="heart" style="top: 30%; left: 10%;"></div>
        <div class="heart" style="top: 35%; left: 60%;"></div>
        <div class="heart" style="top: 40%; left: 30%;"></div>
        <div class="heart" style="top: 45%; left: 90%;"></div>
        <div class="heart" style="top: 50%; left: 5%;"></div>
    </div>
</body>
</html>
